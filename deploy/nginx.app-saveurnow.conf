# Only needed if the droplet turns out to be running nginx instead of Caddy
# (run the diagnostic command in DEPLOY.md first to confirm which one).
#
# Install: copy to /etc/nginx/sites-available/app.saveurnow.com, then
#   sudo ln -s /etc/nginx/sites-available/app.saveurnow.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d app.saveurnow.com
# certbot will rewrite this file in place to add the SSL certificate/listen
# 443 block and an http->https redirect — that's expected, run it once after
# the plain-HTTP block below is live and DNS has propagated.

server {
    listen 80;
    server_name app.saveurnow.com;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Next.js dev/HMR doesn't run in production, but Upgrade headers are
        # cheap to pass through and future-proof this if a WebSocket-based
        # feature is ever added client-side.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
